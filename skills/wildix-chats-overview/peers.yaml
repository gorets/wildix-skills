peers:
  - name: wildix-auth
    install: npx skills add gorets/wildix-skills --s wildix-auth
    install_policy: ask
    purpose: Authenticate with Wildix x-bees via AWS Cognito and obtain tokens for API calls.

  - name: wildix-calls-history
    install: npx skills add gorets/wildix-skills --s wildix-calls-history
    install_policy: ask
    purpose: "Details of the conferences found in the messages: participants, AI summary and insights."
