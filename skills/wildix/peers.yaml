# Wildix router peer manifest.
#
# One entry per skill in the Wildix pack. The router (skills/wildix/SKILL.md)
# uses this file as the single source of truth for:
#   - install: command to run if missing
#   - install_policy: "silent" (auto) or "ask" (confirm with user first)
#   - purpose: one-sentence description used for routing decisions

peers:
  - name: wildix-auth
    install: npx skills add gorets/wildix-skills --s wildix-auth
    install_policy: ask
    purpose: Authenticate with Wildix x-bees via AWS Cognito. Required by all other skills.

  - name: wildix-chats-overview
    install: npx skills add gorets/wildix-skills --s wildix-chats-overview
    install_policy: ask
    purpose: Fetch and summarize x-bees chats for today, yesterday, a specific date, or a date range.


  - name: wildix-chats
    install: npx skills add gorets/wildix-skills --s wildix-chats
    install_policy: ask
    purpose: "Chats on the new Wildix Stream service as the authenticated user: channels, messages, inbox, search, members, files, mentions, users, and live chat events."

  - name: wildix-calls-history
    install: npx skills add gorets/wildix-skills --s wildix-calls-history
    install_policy: ask
    purpose: "Calls and meetings that are over, as the authenticated user: record, transcript, AI summary and insights, recording link, call history, search."

  - name: wildix-call-control
    install: npx skills add gorets/wildix-skills --s wildix-call-control
    install_policy: ask
    purpose: "Live phone calls on the user's Wildix PBX, as the authenticated user: place, answer, hold, transfer, DTMF, hang up, record, devices and ringing mode, and a live view of calls."

  - name: wildix-live-monitor
    install: npx skills add gorets/wildix-skills --s wildix-live-monitor
    install_policy: ask
    purpose: "What is going on now in the company, read only, as the authenticated user: call queues and agents, calls and customer chats in progress with live AI insights, presence of colleagues, live transcript of a call, live feed."

  - name: wildix-adr-from-meeting
    install: npx skills add gorets/wildix-skills --s wildix-adr-from-meeting
    install_policy: ask
    purpose: "Turn a meeting transcription into an Architecture Decision Record and publish it to Confluence."
